name: Agent evals

# Manual only: an eval run calls the real AI provider and spends its quota.
# Needs the repository secret GROQ_API_KEY (Settings > Secrets and variables > Actions).
on:
  workflow_dispatch:
    inputs:
      cases:
        description: 'How many cases to run (empty = all)'
        required: false
        default: ''
      only:
        description: 'Comma-separated case ids to run instead (optional)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  evals:
    name: Run the agent evals
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Check the secret
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Add the GROQ_API_KEY repository secret to run the evals."
            exit 1
          fi
      - name: Run evals
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CASES: ${{ inputs.cases }}
          ONLY: ${{ inputs.only }}
        run: |
          # Inputs become Maven arguments, so only simple values are accepted.
          if ! [[ "$CASES" =~ ^[0-9]*$ && "$ONLY" =~ ^[a-z0-9,-]*$ ]]; then
            echo "::error::cases must be a number and only a list of case ids."
            exit 1
          fi
          ARGS=""
          if [ -n "$CASES" ]; then ARGS="$ARGS -Devals.cases=$CASES"; fi
          if [ -n "$ONLY" ]; then ARGS="$ARGS -Devals.only=$ONLY"; fi
          ./mvnw -B -ntp verify -Devals=true $ARGS -Dit.test=AgentEvalsIT -Dtest=none \
            -Dsurefire.failIfNoSpecifiedTests=false
      - name: Show the report
        if: always()
        run: |
          if [ -f target/evals/report.md ]; then cat target/evals/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: backend/target/evals/
          if-no-files-found: ignore
