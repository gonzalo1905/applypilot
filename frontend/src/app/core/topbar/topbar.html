<header class="topbar">
  <a class="home" routerLink="/board" aria-label="ApplyPilot board"><app-logo /></a>

  <nav class="nav" aria-label="Main">
    <a routerLink="/board" routerLinkActive="active" ariaCurrentWhenActive="page">Board</a>
    <a routerLink="/profile" routerLinkActive="active" ariaCurrentWhenActive="page">Profile</a>
  </nav>

  <div class="account">
    <app-theme-toggle />
    @if (user(); as currentUser) {
      <span class="who">
        <span class="avatar" aria-hidden="true">{{ initials() }}</span>
        <span class="user-name" data-testid="user-name">{{ currentUser.fullName }}</span>
      </span>
    }
    <button class="btn btn-ghost btn-sm" type="button" data-testid="logout" (click)="logout()">
      Log out
    </button>
  </div>
</header>
